name: build

on:
  push: {branches: [master]}
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test:
    name: ${{ matrix.name }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest,    name: linux-amd64}
          - {os: ubuntu-24.04-arm, name: linux-arm64}
          - {os: macos-latest,     name: macos-arm64}
          - {os: windows-latest,   name: windows}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: {go-version: '1.23'}
      - run: go test -v -race

  test-alpine:
    name: alpine-x86_64
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jirutka/setup-alpine@v1
        with:
          branch: latest-stable
          packages: gcc musl-dev go
      - run: go test -v -race
        shell: alpine.sh --root {0}

  release:
    needs: [test, test-alpine]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - id: bump
        uses: anothrNick/github-tag-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch
          RELEASE_BRANCHES: master
          WITH_V: true
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: gh release create "$TAG" --title "go-goldilocks $TAG" --generate-notes
